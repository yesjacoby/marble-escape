<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0f15"><meta name="apple-mobile-web-app-capable" content="yes">
</head><body>
<title>쇠구슬 탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* 2D 만화 룩: 크림색 종이 + 망점, 굵은 잉크 선, 각진 상자 */
:root{
  --paper:#fff3dc; --dot:rgba(36,31,51,.07); --ink:#241f33; --dim:#6b6377;
  --accent:#ff7a59; --pop:#ffd34e; --mint:#8ee6c9;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.8px);background-size:12px 12px;color:var(--ink);font-family:var(--f-body);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hud>div{background:#fff;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:6px 10px}
.tag{font-family:var(--f-display);font-size:13px;letter-spacing:.04em;color:var(--ink)}
.big{font-family:var(--f-mono);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.floors{display:flex;gap:4px;margin-top:6px}
.floors i{width:18px;height:7px;background:#fff;border:2px solid var(--ink)}
.floors i.on{background:var(--accent)}
.bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.hint{font-size:13px;font-weight:600;color:var(--ink);text-align:center;text-wrap:balance;background:#fff;border:2px solid var(--ink);padding:4px 10px}
.btns{display:flex;gap:10px;pointer-events:auto}
button{font:700 14px var(--f-body);color:var(--ink);background:#fff;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 14px;border-radius:0;cursor:pointer}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button.primary{background:var(--accent);color:#fff;font-family:var(--f-display);font-weight:400;font-size:20px;padding:14px 30px;box-shadow:5px 5px 0 var(--ink);
  -webkit-text-stroke:1px var(--ink);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background:rgba(255,243,220,.6)}
.card{max-width:340px;width:100%;background:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:26px 22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start;transform:rotate(-1deg)}
.card h1,.card h2{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
.card h1{font-size:48px;color:var(--pop);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.card h2{font-size:40px;color:var(--accent);-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.card .tag{background:var(--mint);border:2px solid var(--ink);padding:2px 8px}
.card p{margin:0;font-size:14px;line-height:1.6;color:var(--dim)}
.card .row{display:flex;gap:10px;flex-wrap:wrap}
.stat{font-family:var(--f-mono);font-size:15px;color:var(--ink)}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border:2.5px dashed var(--ink);border-radius:50%;pointer-events:none}
#joy b{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--pop);border:2.5px solid var(--ink)}
[hidden]{display:none!important}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 78px);transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;
  background:#fff;border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);color:var(--ink);padding:10px 16px;font-size:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#toast b{color:var(--accent);font-weight:700}
/* 만화 효과 글자 */
.fx{position:fixed;left:0;top:0;pointer-events:none;font-family:var(--f-display);font-size:30px;color:var(--pop);-webkit-text-stroke:1.5px var(--ink);
  text-shadow:3px 3px 0 var(--ink);white-space:nowrap;animation:fxPop .75s ease-out forwards}
.fx.blue{color:var(--mint)} .fx.red{color:var(--accent)}
@keyframes fxPop{0%{transform:translate(-50%,-50%) scale(.3) rotate(var(--r));opacity:0}20%{transform:translate(-50%,-80%) scale(1.15) rotate(var(--r));opacity:1}
  100%{transform:translate(-50%,-150%) scale(1) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="c" aria-label="투명 구체 안의 미로"></canvas>

<div class="hud">
  <div>
    <div class="tag">단계 <span id="lvl">1</span> / <span id="lvlMax">3</span></div>
    <div class="floors" id="floors"></div>
  </div>
  <div style="text-align:right">
    <div class="tag">시간</div>
    <div class="big" id="time">0.00</div>
  </div>
</div>

<div class="bar">
  <div class="hint" id="hint">폰을 기울여 쇠구슬을 굴리세요</div>
  <div class="btns">
    <button id="calib" type="button">지금 각도를 수평으로</button>
    <button id="restart" type="button">처음부터</button>
  </div>
</div>

<div id="joy" hidden><b></b></div>
<div id="toast" role="status"></div>

<div class="overlay" id="startOv">
  <div class="card">
    <div class="tag">유리 구슬 미로</div>
    <h1>쇠구슬 탈출</h1>
    <p>구체 안에 미로가 여러 층 쌓여 있어요. 주황 고리 구멍에 넣으면 구슬이 한 층 아래로 떨어지고, 그 층에서 다시 다음 주황 고리를 찾아가요. 맨 아래층의 주황 고리 출구로 구슬을 구체 밖까지 빼내면 성공입니다.</p>
    <p>폰을 편하게 든 각도가 수평이 돼요. 기울기 센서가 없으면 화면을 끌어서 기울입니다.</p>
    <button class="primary" id="startBtn" type="button">시작하기</button>
  </div>
</div>

<div class="overlay" id="winOv" hidden>
  <div class="card">
    <div class="tag" id="winTag">단계 1 탈출</div>
    <h2>빠져나왔다!</h2>
    <div class="stat">기록 <span id="winTime">0.00</span>초</div>
    <div class="stat" style="color:var(--dim)">최고 <span id="winBest">-</span></div>
    <div class="row">
      <button class="primary" id="nextBtn" type="button">다음 단계</button>
      <button id="againBtn" type="button">다시 하기</button>
    </div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- 상수 ----------
const R = 3;            // 유리 구체 반지름
const BR = 0.12;        // 쇠구슬 반지름
const WALL_H = 0.32, WALL_T = 0.06, FLOOR_T = 0.06;
const G = 9.8 * 2.3;   // 실제 구슬처럼 빠르게 반응
const MAX_TILT = THREE.MathUtils.degToRad(32);
const MAX_GYRO = THREE.MathUtils.degToRad(60);
const LEVELS = [
  { cell: 0.78, floors: [0.55, -0.75], seed: 7 },
  { cell: 0.62, floors: [1.1, 0.0, -1.1], seed: 21 },
  { cell: 0.5,  floors: [1.15, 0.0, -1.15], seed: 1999 },
];
const FLOOR_COLORS = [0x8ee6c9, 0xffa8c5, 0xffd34e];   // 민트, 딸기우유, 바나나

// ---------- 렌더러 ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
void pmrem; void RoomEnvironment;
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 8, 5); scene.add(key);
// 툰 명암: 3단으로 딱 끊는다
const toonRamp = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.RedFormat);
toonRamp.minFilter = toonRamp.magFilter = THREE.NearestFilter; toonRamp.needsUpdate = true;
const INK = 0x241f33;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: toonRamp, ...extra });

const world = new THREE.Group(); scene.add(world);   // 기울어지는 구체 전체
const levelGroup = new THREE.Group(); world.add(levelGroup);

// 유리 구체: 아주 옅은 하늘색 + 가장자리만 굵은 잉크선 (만화 원 테두리)
const glassMat = new THREE.MeshBasicMaterial({ color: 0xbfe9ff, transparent: true, opacity: 0.12, depthWrite: false });
const glass = new THREE.Mesh(new THREE.SphereGeometry(R, 72, 54), glassMat); glass.renderOrder = 10; world.add(glass);
const rimMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { ink: { value: new THREE.Color(INK) }, sky: { value: new THREE.Color(0x7fd0ff) } },
  vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform vec3 ink; uniform vec3 sky; varying vec3 vN; varying vec3 vV; void main(){
    float f = 1.-abs(dot(vN,vV));
    if (f > 0.93) { gl_FragColor = vec4(ink, 1.); return; }
    if (f > 0.72) { gl_FragColor = vec4(sky, 0.35); return; }
    float hl = smoothstep(0.03, 0.0, abs(length(vN.xy - vec2(-0.48, 0.5)) - 0.2)) * step(vN.x, -0.3) * step(0.4, vN.y);
    gl_FragColor = vec4(1., 1., 1., hl * 0.95);
  }`
});
const rim = new THREE.Mesh(new THREE.SphereGeometry(R * 1.002, 72, 54), rimMat); rim.renderOrder = 11; world.add(rim);
const seam = new THREE.Mesh(new THREE.TorusGeometry(R, 0.03, 8, 128), new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.35 }));
seam.rotation.x = Math.PI / 2; world.add(seam);

// 쇠구슬
const ball = new THREE.Mesh(new THREE.SphereGeometry(BR, 40, 28), toon(0xd9dde6));
ball.renderOrder = 5; world.add(ball);
const ballLine = new THREE.Mesh(new THREE.SphereGeometry(BR * 1.16, 32, 20), new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide }));
world.add(ballLine);
// 얼굴: 구르는 구슬과 따로, 늘 화면 쪽 + 가는 방향을 본다
function faceTex(kind) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#241f33'; g.fillStyle = '#241f33'; g.lineWidth = 11;
  g.save(); g.fillStyle = '#fff'; g.beginPath(); g.ellipse(34, 30, 13, 8, -0.6, 0, Math.PI * 2); g.fill(); g.restore();
  if (kind === 'dizzy') {
    for (const x of [44, 84]) { g.beginPath(); g.moveTo(x - 10, 50); g.lineTo(x + 10, 70); g.moveTo(x + 10, 50); g.lineTo(x - 10, 70); g.stroke(); }
    g.beginPath(); g.moveTo(48, 96); g.quadraticCurveTo(56, 88, 64, 96); g.quadraticCurveTo(72, 104, 80, 96); g.stroke();
  } else {
    for (const x of [46, 82]) { g.beginPath(); g.ellipse(x, 60, 11, kind === 'wow' ? 16 : 14, 0, 0, Math.PI * 2); g.fill();
      g.save(); g.fillStyle = '#fff'; g.beginPath(); g.arc(x + 3, 55, 3.2, 0, Math.PI * 2); g.fill(); g.restore(); }
    if (kind === 'wow') { g.beginPath(); g.ellipse(64, 95, 8, 10, 0, 0, Math.PI * 2); g.fill(); }
    else { g.beginPath(); g.arc(64, 84, 13, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke(); }
    g.save(); g.globalAlpha = 0.45; g.fillStyle = '#ff7a8a'; for (const x of [28, 100]) { g.beginPath(); g.ellipse(x, 80, 9, 5, 0, 0, Math.PI * 2); g.fill(); } g.restore();
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const FACES = { happy: faceTex('happy'), wow: faceTex('wow'), dizzy: faceTex('dizzy') };
const face = new THREE.Sprite(new THREE.SpriteMaterial({ map: FACES.happy, transparent: true }));
face.scale.setScalar(BR * 1.9); face.renderOrder = 6; world.add(face);
let faceKind = 'happy', dizzyT = 0;
const camLocal = new THREE.Vector3(), faceDir = new THREE.Vector3();

const shadow = new THREE.Mesh(new THREE.CircleGeometry(BR * 1.15, 24), new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: 0.5, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; world.add(shadow);

// ---------- 레벨 생성 ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
let level = null;
const boxGeo = new THREE.BoxGeometry(1, 1, 1);

function clearLevel() {
  for (const ch of [...levelGroup.children]) { levelGroup.remove(ch); if (ch.isInstancedMesh) ch.dispose(); if (ch.material) ch.material.dispose?.(); }
}
function box(list, x0, y0, z0, x1, y1, z1, kind) {
  const b = { min: new THREE.Vector3(Math.min(x0, x1), Math.min(y0, y1), Math.min(z0, z1)), max: new THREE.Vector3(Math.max(x0, x1), Math.max(y0, y1), Math.max(z0, z1)), kind };
  list.push(b); return b;
}
function instanced(boxes, mat, grow = 0) {
  const m = new THREE.InstancedMesh(boxGeo, mat, boxes.length);
  const o = new THREE.Object3D();
  boxes.forEach((b, i) => {
    o.position.set((b.min.x + b.max.x) / 2, (b.min.y + b.max.y) / 2, (b.min.z + b.max.z) / 2);
    o.scale.set(b.max.x - b.min.x, b.max.y - b.min.y, b.max.z - b.min.z);
    if (b.kind === 'floor' && !grow) { o.scale.x -= 0.012; o.scale.z -= 0.012; }
    o.scale.addScalar(grow * 2);
    o.updateMatrix(); m.setMatrixAt(i, o.matrix);
  });
  return m;
}

function buildLevel(idx) {
  clearLevel();
  const def = LEVELS[idx], rng = mulberry32(def.seed), c = def.cell;
  const N = Math.floor((2 * R) / c), off = (N - 1) / 2, F = def.floors.length;
  const cx = i => (i - off) * c;
  const validFns = def.floors.map(h => {
    const yy = Math.max(Math.abs(h - FLOOR_T), Math.abs(h + WALL_H + 0.05));
    const rf = Math.sqrt(R * R - yy * yy) - 0.08;
    return (i, j) => i >= 0 && j >= 0 && i < N && j < N && Math.hypot(Math.abs(cx(i)) + c / 2, Math.abs(cx(j)) + c / 2) < rf;
  });
  let entry = null, best = 1e9;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (validFns[0](i, j)) { const d = Math.hypot(cx(i), cx(j)); if (d < best) { best = d; entry = [i, j]; } }

  level = { def, c, boxes: [], floors: [], exitDir: null, start: new THREE.Vector3(cx(entry[0]), def.floors[0] + BR + 0.5, cx(entry[1])), entries: [] };
  const linkKey = (a, b, c2, d) => (a < c2 || (a === c2 && b < d)) ? `${a},${b}|${c2},${d}` : `${c2},${d}|${a},${b}`;

  for (let k = 0; k < F; k++) {
    const h = def.floors[k], valid = validFns[k], kk = (i, j) => i * N + j;
    level.entries.push(new THREE.Vector3(cx(entry[0]), h + BR + 0.25, cx(entry[1])));
    const dist = new Map([[kk(...entry), 0]]), links = new Set(), stack = [entry];
    while (stack.length) {
      const [i, j] = stack[stack.length - 1];
      const opts = DIRS.filter(([di, dj]) => valid(i + di, j + dj) && !dist.has(kk(i + di, j + dj)));
      if (!opts.length) { stack.pop(); continue; }
      const [di, dj] = opts[Math.floor(rng() * opts.length)];
      const ni = i + di, nj = j + dj;
      dist.set(kk(ni, nj), dist.get(kk(i, j)) + 1); links.add(linkKey(i, j, ni, nj)); stack.push([ni, nj]);
    }
    let target = null, tdist = -1, exitIJ = null;
    for (const [key, d] of dist) {
      const i = Math.floor(key / N), j = key % N;
      if (k < F - 1) { if (validFns[k + 1](i, j) && d > tdist) { tdist = d; target = [i, j]; } }
      else for (const [di, dj] of DIRS) if (!valid(i + di, j + dj) && d > tdist) { tdist = d; target = [i, j]; exitIJ = [di, dj]; }
    }
    const fl = [], wl = [];
    const wall = (x, z, di, dj) => {
      if (di) { const wx = x + di * c / 2; box(wl, wx - WALL_T / 2, h, z - c / 2 - WALL_T / 2, wx + WALL_T / 2, h + WALL_H, z + c / 2 + WALL_T / 2, 'wall'); }
      else { const wz = z + dj * c / 2; box(wl, x - c / 2 - WALL_T / 2, h, wz - WALL_T / 2, x + c / 2 + WALL_T / 2, h + WALL_H, wz + WALL_T / 2, 'wall'); }
    };
    for (const [key] of dist) {
      const i = Math.floor(key / N), j = key % N, x = cx(i), z = cx(j);
      const isHole = k < F - 1 && i === target[0] && j === target[1];
      if (!isHole) box(fl, x - c / 2, h - FLOOR_T, z - c / 2, x + c / 2, h, z + c / 2, 'floor');
      for (const [di, dj] of DIRS) {
        if (k === F - 1 && i === target[0] && j === target[1] && di === exitIJ[0] && dj === exitIJ[1]) continue;
        const ni = i + di, nj = j + dj;
        if (valid(ni, nj)) { if (di < 0 || dj < 0) continue; if (links.has(linkKey(i, j, ni, nj))) continue; }
        wall(x, z, di, dj);
      }
    }
    const color = FLOOR_COLORS[k % FLOOR_COLORS.length];
    const floorMat = toon(new THREE.Color(color).lerp(new THREE.Color(0xffffff), 0.5), { transparent: true, opacity: 0.6, depthWrite: false });
    const wallMat = toon(color, { transparent: true, opacity: 1 });
    const lineMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide, transparent: true, opacity: 1 });
    const floorInfo = { h, floorMat, wallMat, lineMat, marker: null };

    if (k < F - 1) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(c * 0.4, 0.04, 8, 40), toon(0xff7a59, { emissive: 0xff7a59, emissiveIntensity: 0.35 }));
      ring.rotation.x = Math.PI / 2; ring.position.set(cx(target[0]), h + 0.01, cx(target[1])); levelGroup.add(ring); floorInfo.marker = ring;
      // 구멍 아래 통로: 떨어지는 구슬이 옆으로 날아가 아래층 벽을 넘지 않게 사방을 막는다.
      // 아래쪽은 구슬이 굴러 나갈 만큼만 비워 둔다 (아래층 벽보다 낮게).
      const x = cx(target[0]), z = cx(target[1]), y0 = def.floors[k + 1] + 2 * BR + 0.05, y1 = h - FLOOR_T, sl = [];
      box(sl, x - c / 2 - WALL_T / 2, y0, z - c / 2, x - c / 2 + WALL_T / 2, y1, z + c / 2, 'wall');
      box(sl, x + c / 2 - WALL_T / 2, y0, z - c / 2, x + c / 2 + WALL_T / 2, y1, z + c / 2, 'wall');
      box(sl, x - c / 2, y0, z - c / 2 - WALL_T / 2, x + c / 2, y1, z - c / 2 + WALL_T / 2, 'wall');
      box(sl, x - c / 2, y0, z + c / 2 - WALL_T / 2, x + c / 2, y1, z + c / 2 + WALL_T / 2, 'wall');
      const shaftMat = toon(0xff7a59, { transparent: true, opacity: 0.22, depthWrite: false });
      levelGroup.add(instanced(sl, shaftMat)); level.boxes.push(...sl);
    } else {
      // 출구 홈통: 출구 칸에서 구체 밖까지
      const [di, dj] = exitIJ, x = cx(target[0]), z = cx(target[1]);
      const sgn = di || dj, along0 = (di ? x : z) + sgn * c / 2, along1 = sgn * (R + 0.6), lat = di ? z : x;
      if (di) { box(fl, along0, h - FLOOR_T, lat - c / 2, along1, h, lat + c / 2, 'floor');
        box(wl, along0, h, lat - c / 2 - WALL_T / 2, along1, h + WALL_H, lat - c / 2 + WALL_T / 2, 'wall');
        box(wl, along0, h, lat + c / 2 - WALL_T / 2, along1, h + WALL_H, lat + c / 2 + WALL_T / 2, 'wall'); }
      else { box(fl, lat - c / 2, h - FLOOR_T, along0, lat + c / 2, h, along1, 'floor');
        box(wl, lat - c / 2 - WALL_T / 2, h, along0, lat - c / 2 + WALL_T / 2, h + WALL_H, along1, 'wall');
        box(wl, lat + c / 2 - WALL_T / 2, h, along0, lat + c / 2 + WALL_T / 2, h + WALL_H, along1, 'wall'); }
      const y = h + BR, a = Math.sqrt(R * R - y * y - lat * lat);
      const E = di ? new THREE.Vector3(sgn * a, y, lat) : new THREE.Vector3(lat, y, sgn * a);
      level.exitDir = E.clone().normalize();
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.06, 10, 48), toon(0xff7a59, { emissive: 0xff7a59, emissiveIntensity: 0.35 }));
      ring.position.copy(E); ring.lookAt(E.clone().multiplyScalar(2)); levelGroup.add(ring); floorInfo.marker = ring;
    }
    levelGroup.add(instanced(fl, floorMat)); levelGroup.add(instanced(wl, wallMat));
    levelGroup.add(instanced(wl, lineMat, 0.018));   // 만화 외곽선 (뒷면을 살짝 키워 검게)
    level.boxes.push(...fl, ...wl);
    level.floors.push(floorInfo);
    entry = target;
  }
  document.getElementById('lvl').textContent = idx + 1;
  document.getElementById('floors').innerHTML = def.floors.map(() => '<i></i>').join('');
}

// ---------- 물리 (구체 좌표계 안에서 직접 계산) ----------
const p = new THREE.Vector3(), v = new THREE.Vector3(), gLocal = new THREE.Vector3(0, -G, 0);
const tmp = new THREE.Vector3(), n = new THREE.Vector3();
let escaped = false, escapeT = 0;
const EXIT_COS = Math.cos(0.15);

function stepPhysics(dt) {
  v.addScaledVector(gLocal, dt);
  v.multiplyScalar(1 - 0.18 * dt);
  if (v.length() > 11) v.setLength(11);
  p.addScaledVector(v, dt);
  let impact = 0;
  for (const b of level.boxes) {
    if (p.y < b.min.y - BR || p.y > b.max.y + BR) continue;
    const qx = Math.max(b.min.x, Math.min(p.x, b.max.x)), qy = Math.max(b.min.y, Math.min(p.y, b.max.y)), qz = Math.max(b.min.z, Math.min(p.z, b.max.z));
    const dx = p.x - qx, dy = p.y - qy, dz = p.z - qz, d2 = dx * dx + dy * dy + dz * dz;
    if (d2 >= BR * BR) continue;
    const d = Math.sqrt(d2);
    if (d < 1e-6) n.set(0, 1, 0); else n.set(dx / d, dy / d, dz / d);
    p.set(qx, qy, qz).addScaledVector(n, BR);
    const vn = v.dot(n);
    if (vn < 0) { const e = -vn > 0.6 ? 0.35 : 0; v.addScaledVector(n, -(1 + e) * vn); if (n.y < 0.5) impact = Math.max(impact, -vn); }
  }
  const len = p.length();
  if (!escaped && len > R - BR) {
    tmp.copy(p).divideScalar(len);
    if (!(level.exitDir && tmp.dot(level.exitDir) > EXIT_COS)) {
      p.copy(tmp).multiplyScalar(R - BR);
      const vn = v.dot(tmp);
      if (vn > 0) { const e = vn > 0.6 ? 0.35 : 0; v.addScaledVector(tmp, -(1 + e) * vn); impact = Math.max(impact, vn); }
    }
  }
  if (!escaped && len > R + 0.08) onEscape();
  return impact;
}

// ---------- 입력 ----------
let started = false, hasGyro = false, base = null;
const sensor = new THREE.Vector3(0, -1, 0), gDev = new THREE.Vector3(), qBase = new THREE.Quaternion(), DEV_DOWN = new THREE.Vector3(0, 0, -1);
const drag = { on: false, x: 0, z: 0 }, keys = { x: 0, z: 0 };
const tilt = { x: 0, z: 0 };
const DOWN = new THREE.Vector3(0, -1, 0), tmpG = new THREE.Vector3(), gTarget = new THREE.Vector3(), gNow = new THREE.Vector3(0, -1, 0);
let visK = 1;
const clampT = a => Math.max(-MAX_TILT, Math.min(MAX_TILT, a));
const wrap = a => ((a + 180) % 360 + 360) % 360 - 180;

window.addEventListener('deviceorientation', e => {
  if (e.beta == null || e.gamma == null) return;
  if (!hasGyro) { hasGyro = true; updateHint(); }
  // 폰 화면 기준 실제 중력 방향
  const b = THREE.MathUtils.degToRad(e.beta), g = THREE.MathUtils.degToRad(e.gamma);
  gDev.set(Math.cos(b) * Math.sin(g), -Math.sin(b), -Math.cos(b) * Math.cos(g));
  if (!base) { base = true; qBase.setFromUnitVectors(gDev, DEV_DOWN); }
  gDev.applyQuaternion(qBase);
  // 화면 오른쪽=x, 화면 위쪽=안쪽(-z), 화면 바깥=위(+y)
  sensor.set(gDev.x, gDev.z, -gDev.y).normalize();
  const ang = sensor.angleTo(DOWN);
  if (ang > MAX_GYRO) { tmpG.set(sensor.x, 0, sensor.z).normalize(); sensor.copy(DOWN).multiplyScalar(Math.cos(MAX_GYRO)).addScaledVector(tmpG, Math.sin(MAX_GYRO)); }
});

const joy = document.getElementById('joy'), knob = joy.querySelector('b');
let dragStart = null;
canvas.addEventListener('pointerdown', e => {
  if (!started) return;
  dragStart = { x: e.clientX, y: e.clientY, id: e.pointerId }; drag.on = true; drag.x = drag.z = 0;
  canvas.setPointerCapture(e.pointerId);
  joy.style.left = e.clientX + 'px'; joy.style.top = e.clientY + 'px'; joy.hidden = false; knob.style.transform = '';
});
canvas.addEventListener('pointermove', e => {
  if (!dragStart || e.pointerId !== dragStart.id) return;
  let dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y; const m = Math.hypot(dx, dy), lim = 55;
  if (m > lim) { dx *= lim / m; dy *= lim / m; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  drag.x = clampT(dy / lim * MAX_TILT); drag.z = clampT(-dx / lim * MAX_TILT);
});
const endDrag = e => { if (dragStart && e.pointerId === dragStart.id) { dragStart = null; drag.on = false; joy.hidden = true; } };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
const held = new Set();
addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) { held.add(e.key); e.preventDefault(); } });
addEventListener('keyup', e => held.delete(e.key));

function updateHint() {
  document.getElementById('hint').textContent = hasGyro ? '폰을 기울여 쇠구슬을 굴리세요 · 화면을 끌어도 돼요' : '화면을 끌어서 구체를 기울이세요 · 키보드는 방향키';
  document.getElementById('calib').hidden = !hasGyro;
}

// ---------- 소리 ----------
let actx = null, lastHit = 0;
function tone(freq, t0, dur, vol, type = 'sine') {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function hitSound(s) {
  if (!actx) return; const now = actx.currentTime; if (now - lastHit < 0.045) return; lastHit = now;
  const vol = Math.min(0.22, 0.03 + s * 0.06);
  tone(2300 + Math.random() * 400, now, 0.09, vol, 'triangle'); tone(4100, now, 0.05, vol * 0.4);
  if (s > 1.2 && navigator.vibrate) navigator.vibrate(12);
}
function dropSound() { if (!actx) return; const t = actx.currentTime; tone(520, t, 0.25, 0.15, 'triangle'); tone(260, t + 0.05, 0.3, 0.12); }
function winSound() { if (!actx) return; const t = actx.currentTime; [784, 988, 1175, 1568].forEach((f, i) => tone(f, t + i * 0.09, 0.4, 0.14, 'triangle')); }

// ---------- 진행 ----------
let lvlIdx = 0, tStart = 0, tNow = 0, curFloor = 0;
const timeEl = document.getElementById('time');
function resetBall() {
  p.copy(level.start); v.set(0, 0, 0); escaped = false; curFloor = 0; standFloor = 0; lostT = 0; camY = level.floors[0].h; tStart = performance.now(); tNow = 0;
}
function startLevel(i) { lvlIdx = i; buildLevel(i); resetBall(); document.getElementById('lvlMax').textContent = LEVELS.length; }
function bestKey(i) { return 'marble-best-' + i; }
function onEscape() {
  escaped = true; escapeT = performance.now(); tNow = (escapeT - tStart) / 1000; winSound();
  let best = null; try { best = parseFloat(localStorage.getItem(bestKey(lvlIdx))); if (!(best > 0) || tNow < best) { localStorage.setItem(bestKey(lvlIdx), tNow.toFixed(2)); best = tNow; } } catch (e) { best = tNow; }
  setTimeout(() => {
    document.getElementById('winTag').textContent = `단계 ${lvlIdx + 1} 탈출`;
    document.getElementById('winTime').textContent = tNow.toFixed(2);
    document.getElementById('winBest').textContent = best ? best.toFixed(2) + '초' : '-';
    const last = lvlIdx === LEVELS.length - 1;
    document.getElementById('nextBtn').textContent = last ? '1단계부터 다시' : '다음 단계';
    document.getElementById('winOv').hidden = false;
  }, 1100);
}

document.getElementById('startBtn').addEventListener('click', () => {
  const D = window.DeviceOrientationEvent;
  if (D && typeof D.requestPermission === 'function') D.requestPermission().catch(() => {}).finally(() => {});
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  base = null; started = true; document.getElementById('startOv').hidden = true; updateHint(); resetBall();
});
document.getElementById('calib').addEventListener('click', () => { base = null; });
document.getElementById('restart').addEventListener('click', () => { document.getElementById('winOv').hidden = true; resetBall(); });
document.getElementById('nextBtn').addEventListener('click', () => { document.getElementById('winOv').hidden = true; startLevel((lvlIdx + 1) % LEVELS.length); });
document.getElementById('againBtn').addEventListener('click', () => { document.getElementById('winOv').hidden = true; resetBall(); });

// ---------- 화면 맞추기 ----------
const camBase = new THREE.Vector3(), tmpCam = new THREE.Vector3();
let camY = 0, lostT = 0, standFloor = 0;
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  const dist = (R + 0.45) / Math.sin(Math.min(vf, hf) / 2);
  camBase.set(0, 0.68, 0.73).normalize().multiplyScalar(dist);
  camera.position.copy(camBase);
  camera.lookAt(0, -0.25, 0); camera.updateProjectionMatrix();
}
let toastTimer = 0;
// 구슬 위치에 만화 효과 글자를 띄운다
const fxPos = new THREE.Vector3();
let fxLast = 0;
function comicFx(text, tone = '') {
  const t = performance.now(); if (t - fxLast < 250) return; fxLast = t;
  fxPos.copy(p); world.localToWorld(fxPos); fxPos.project(camera);
  const el = document.createElement('div'); el.className = 'fx ' + tone; el.textContent = text;
  el.style.left = ((fxPos.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - fxPos.y) / 2 * innerHeight - 20) + 'px';
  el.style.setProperty('--r', (Math.random() * 24 - 12).toFixed(1) + 'deg');
  document.body.appendChild(el); setTimeout(() => el.remove(), 800);
}
function showToast(html) {
  const t = document.getElementById('toast'); t.innerHTML = html; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
addEventListener('resize', resize); resize();

// ---------- 루프 ----------
const q = new THREE.Quaternion(), qInv = new THREE.Quaternion(), eul = new THREE.Euler();
const axis = new THREE.Vector3(), rq = new THREE.Quaternion();
let last = performance.now(), acc = 0;
startLevel(0);
updateHint();

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // 목표 기울기
  keys.x = (held.has('ArrowDown') ? 1 : 0) - (held.has('ArrowUp') ? 1 : 0);
  keys.z = (held.has('ArrowLeft') ? 1 : 0) - (held.has('ArrowRight') ? 1 : 0);
  let tx = 0, tz = 0;
  if (drag.on) { tx = drag.x; tz = drag.z; }
  else if (keys.x || keys.z) { tx = keys.x * MAX_TILT * 0.8; tz = keys.z * MAX_TILT * 0.8; }
  const useGyro = started && hasGyro && !drag.on && !(keys.x || keys.z);
  if (!started) { tx = Math.sin(now / 1400) * 0.18; tz = Math.cos(now / 1700) * 0.18; }
  if (useGyro) gTarget.copy(sensor);
  else { tilt.x += (tx - tilt.x) * Math.min(1, dt * 14); tilt.z += (tz - tilt.z) * Math.min(1, dt * 14);
    eul.set(tilt.x, 0, tilt.z, 'XYZ'); q.setFromEuler(eul); qInv.copy(q).invert(); gTarget.copy(DOWN).applyQuaternion(qInv); }
  // 센서는 거의 바로 반영 (떨림만 살짝 거름)
  gNow.lerp(gTarget, useGyro ? Math.min(1, dt * 40) : 1).normalize();
  gLocal.copy(gNow).multiplyScalar(G);
  // 화면 속 구체는 폰과 같이 움직이는 느낌이 나게 덜 기울임
  visK += ((useGyro ? 0.45 : 1) - visK) * Math.min(1, dt * 6);
  q.setFromUnitVectors(gNow, DOWN); qInv.identity().slerp(q, visK); world.quaternion.copy(qInv);

  if (started) {
    acc += dt; let impact = 0; const h = 1 / 240;
    while (acc >= h) { impact = Math.max(impact, stepPhysics(h)); acc -= h; }
    if (impact > 0.35) hitSound(impact);
    if (impact > 2.2) { comicFx(impact > 4 ? '쾅!' : '쿵!', 'red'); dizzyT = 0.7; }
    if (impact > 1.6 && navigator.vibrate) { try { navigator.vibrate(Math.min(25, 6 + impact * 3)); } catch (_) {} }
    // 굴러가는 회전
    axis.copy(gLocal).normalize().negate().cross(v); const sp = axis.length();
    if (sp > 1e-4) { rq.setFromAxisAngle(axis.divideScalar(sp), sp * dt / BR); ball.quaternion.premultiply(rq); }
    if (!escaped) tNow = (now - tStart) / 1000;
  }
  ball.position.copy(p); ballLine.position.copy(p);
  // 얼굴은 카메라 쪽 + 굴러가는 쪽으로 살짝
  camLocal.copy(camera.position); world.worldToLocal(camLocal);
  faceDir.copy(camLocal).sub(p).normalize();
  tmpG.set(v.x, 0, v.z); if (tmpG.lengthSq() > 0.04) faceDir.addScaledVector(tmpG.normalize(), 0.55).normalize();
  face.position.copy(p).addScaledVector(faceDir, BR * 1.0);
  dizzyT = Math.max(0, dizzyT - dt);
  const fk = dizzyT > 0 ? 'dizzy' : (v.y < -1.6 || v.length() > 5) ? 'wow' : 'happy';
  if (fk !== faceKind) { faceKind = fk; face.material.map = FACES[fk]; }
  timeEl.textContent = tNow.toFixed(2);

  // 지금 있는 층, 층 투명도
  if (level) {
    let f = 0; level.floors.forEach(fi => { if (p.y < fi.h - 0.05) f++; });
    f = Math.min(f, level.floors.length - 1);
    if (f !== curFloor) {
      if (f > curFloor) {
        dropSound(); comicFx('슝~', 'blue');
        const lastF = f === level.floors.length - 1;
        showToast(lastF ? `<b>마지막 층!</b> 주황 고리 출구로 구슬을 밖으로 굴려 내보내세요` : `<b>${f + 1}층</b>으로 내려왔어요 · 이 층의 주황 고리를 찾으세요`);
      }
      curFloor = f;
    }
    const k = Math.min(1, dt * 12);
    level.floors.forEach((fi, i) => {
      const above = i < curFloor;
      fi.floorMat.opacity += ((above ? 0.02 : i === curFloor ? 0.7 : 0.35) - fi.floorMat.opacity) * k;
      fi.wallMat.opacity += ((above ? 0.04 : i === curFloor ? 1 : 0.45) - fi.wallMat.opacity) * k;
      fi.lineMat.opacity += ((above ? 0.0 : i === curFloor ? 1 : 0.3) - fi.lineMat.opacity) * k;
      fi.wallMat.depthWrite = fi.wallMat.opacity > 0.9; fi.lineMat.visible = fi.lineMat.opacity > 0.02;
      if (fi.marker) { fi.marker.visible = !above; fi.marker.scale.setScalar((i === curFloor ? 1.15 : 1) + Math.sin(now / 260) * 0.1); }
    });
    // 카메라가 지금 층을 따라 내려간다
    const fy = level.floors[curFloor].h;
    camY += (fy - camY) * Math.min(1, dt * 3);
    camera.position.copy(camBase).add(tmpCam.set(0, camY * 0.6, 0));
    camera.lookAt(0, camY - 0.25, 0);
    document.querySelectorAll('#floors i').forEach((el, i) => el.classList.toggle('on', i === curFloor));
    // 그림자
    let top = -Infinity;
    for (const b of level.boxes) if (b.kind === 'floor' && b.max.y <= p.y && p.x >= b.min.x && p.x <= b.max.x && p.z >= b.min.z && p.z <= b.max.z && b.max.y > top) top = b.max.y;
    // 안전장치: 미로 밖(발밑에 바닥이 없는 곳)에 1.2초 넘게 있으면 지금 층 입구로 되돌린다
    if (started && !escaped && top === -Infinity) {
      lostT += dt;
      if (lostT > 1.2) { p.copy(level.entries[standFloor]); v.set(0, 0, 0); lostT = 0; showToast('구슬이 미로 밖으로 빠져서 <b>이 층 입구</b>로 돌려놨어요'); }
    } else { lostT = 0; if (top > -Infinity && p.y - BR - top < 0.05) standFloor = curFloor; }
    if (top > -Infinity && !escaped) { shadow.visible = true; shadow.position.set(p.x, top + 0.004, p.z); const gap = p.y - BR - top; shadow.material.opacity = Math.max(0, 0.5 - gap * 0.5); shadow.scale.setScalar(1 + gap * 0.6); }
    else shadow.visible = false;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

</body></html>
