<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0c0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>동굴 발굴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--ink:#ece8e1;--dim:#9c978e;--panel:rgba(14,13,12,.72);--line:rgba(236,232,225,.18);--gold:#e9c46a;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0c0c;color:var(--ink);font-family:var(--f-body);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;pointer-events:none}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.big{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.big b{color:var(--gold);font-weight:500}
.bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.hint{font-size:13px;color:var(--dim);text-align:center;text-wrap:balance}
.btns{display:flex;gap:8px;pointer-events:auto}
button{font:600 14px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:#1b1608;border-color:var(--gold);font-size:17px;padding:14px 28px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:rgba(5,5,5,.5);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.card{max-width:340px;width:100%;background:var(--panel);border:1px solid var(--line);padding:26px 22px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.card h1,.card h2{font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
.card h1{font-size:34px}.card h2{font-size:28px;color:var(--gold)}
.card p{margin:0;font-size:14px;line-height:1.6;color:var(--dim)}
.load{font-family:var(--f-mono);font-size:12px;color:var(--dim)}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border:1px solid var(--line);border-radius:50%;pointer-events:none}
#joy b{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--ink);opacity:.4}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;
  background:var(--panel);border:1px solid var(--gold);padding:10px 16px;font-size:14px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="동굴 발굴 현장"></canvas>
<div class="vig"></div>
<div class="hud">
  <div><div class="tag">유물</div><div class="big"><b id="found">0</b> / <span id="total">6</span></div></div>
  <div style="text-align:right"><div class="tag">시간</div><div class="big" id="time">0.00</div></div>
</div>
<div class="bar">
  <div class="hint" id="hint">폰을 기울여 쇠구슬을 굴리세요</div>
  <div class="btns">
    <button id="calib" type="button" hidden>지금 각도를 수평으로</button>
    <button id="restart" type="button">처음부터</button>
  </div>
</div>
<div id="joy" hidden><b></b></div>
<div id="toast" role="status"></div>
<div class="overlay" id="startOv">
  <div class="card">
    <div class="tag">발굴 현장</div>
    <h1>동굴 발굴</h1>
    <p>동굴 속 발굴 현장에 금빛 유물이 하나씩 빛나요. 폰을 기울여 쇠구슬을 굴려서 유물에 닿게 하세요. 구덩이 위 나무판을 건너야 하는 것도 있어요.</p>
    <p>폰을 편하게 든 각도가 수평이 돼요. 센서가 없으면 화면을 끌거나 방향키를 쓰세요.</p>
    <div class="load" id="load">불러오는 중…</div>
    <button class="primary" id="startBtn" type="button" disabled>시작하기</button>
  </div>
</div>
<div class="overlay" id="winOv" hidden>
  <div class="card">
    <div class="tag">발굴 완료</div>
    <h2>유물을 모두 찾았어요</h2>
    <div class="big" style="font-size:16px">기록 <span id="winTime">0.00</span>초 · 최고 <span id="winBest">-</span></div>
    <button class="primary" id="againBtn" type="button">다시 하기</button>
  </div>
</div>

<script type="importmap">

</script>
<script type="module">
import * as THREE from 'three';

  const pos = groundGeo.attributes.position, col = new Float32Array(pos.count * 3);

    const m = pitMask(x, z), k = 1 - 0.32 * m;           // 구덩이 안쪽은 축축하게 조금 더 어둡게
    col[i * 3] = k; col[i * 3 + 1] = k * 0.97; col[i * 3 + 2] = k * 0.94;
  }

}
const ground = new THREE.Mesh(groundGeo, pbr('stony_dirt_path', 8, 30, { vertexColors: true, envMapIntensity: 0.25 }));
ground.receiveShadow = true; scene.add(ground);

// ---------- 동굴 껍데기: 길쭉한 구를 울퉁불퉁하게, 앞쪽은 뚫어서 입구 ----------

  const g = new THREE.SphereGeometry(1, 160, 110);
  const pos = g.attributes.position, idx = g.index.array, keep = [];

  for (let i = 0; i < pos.count; i++) {

// ---------- 소품 ----------
const colliders = { boxes: [], cyl: [], sph: [] };
const wood = pbr('rough_wood', 3, 0.3, { envMapIntensity: 0.3 });
// 구덩이를 가로지르는 나무판 (다리)
const PL = { x0: -2.3, x1: 2.3, z: 3.2, w: 0.34, t: 0.06 };
const plankY = Math.max(H(PL.x0, PL.z), H(PL.x1, PL.z), H(PL.x0 + 0.6, PL.z), H(PL.x1 - 0.6, PL.z)) + 0.005;
{
  const m = new THREE.Mesh(new THREE.BoxGeometry(PL.x1 - PL.x0, PL.t, PL.w), wood);
  m.position.set((PL.x0 + PL.x1) / 2, plankY + PL.t / 2, PL.z); m.castShadow = m.receiveShadow = true; scene.add(m);
  colliders.boxes.push(new THREE.Box3(new THREE.Vector3(PL.x0, plankY - 0.4, PL.z - PL.w / 2), new THREE.Vector3(PL.x1, plankY + PL.t, PL.z + PL.w / 2)));
  // 앞쪽 가장자리에 하나 더 (사진처럼 길게)
  const m2 = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.07, 0.3), wood);
  const y2 = Math.max(H(-2.3, 1.85), H(2.3, 1.85), H(0, 1.85)) + 0.005;
  m2.position.set(0.1, y2 + 0.035, 1.85); m2.rotation.y = 0.04; m2.castShadow = m2.receiveShadow = true; scene.add(m2);
  colliders.boxes.push(new THREE.Box3(new THREE.Vector3(-2.2, y2 - 0.3, 1.7), new THREE.Vector3(2.4, y2 + 0.07, 2.0)));
}
// 발굴 줄 격자와 말뚝
{
  const pts = [], sy = 0.32, x0 = PIT.x - PIT.hx - 0.15, x1 = PIT.x + PIT.hx + 0.15, z0 = PIT.z - PIT.hz - 0.15, z1 = PIT.z + PIT.hz + 0.15;
  const gy = (x, z) => Math.max(H(x, z), 0) + sy;
  for (let i = 0; i <= 3; i++) { const x = x0 + (x1 - x0) * i / 3; pts.push(x, gy(x, z0), z0, x, gy(x, z1), z1); }
  for (let j = 0; j <= 2; j++) { const z = z0 + (z1 - z0) * j / 2; pts.push(x0, gy(x0, z), z, x1, gy(x1, z), z); }
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: 0xe8e2d4, transparent: true, opacity: 0.85 })));
  const stakeM = new THREE.MeshStandardMaterial({ color: 0x8a6a45, roughness: 0.8 });
  for (const [x, z] of [[x0, z0], [x1, z0], [x0, z1], [x1, z1], [(x0 + x1) / 2, z0], [(x0 + x1) / 2, z1], [x0, PIT.z], [x1, PIT.z]]) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.03, sy + 0.1, 0.03), stakeM); s.position.set(x, H(x, z) + (sy + 0.1) / 2 - 0.05, z); s.castShadow = true; scene.add(s);
  }
}
// 양동이
{
  const bm = new THREE.MeshStandardMaterial({ color: 0x1b1c1e, roughness: 0.45, metalness: 0.1, side: THREE.DoubleSide, envMapIntensity: 0.6 });
  const dirt = new THREE.MeshStandardMaterial({ color: 0x5b4a39, roughness: 1 });
  for (const [x, z, r] of [[2.35, 4.95, 0.27], [3.0, 5.55, 0.25]]) {
    const y = H(x, z);
    const b = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.82, 0.42, 32, 1, true), bm); b.position.set(x, y + 0.21, z); b.castShadow = b.receiveShadow = true; scene.add(b);
    const bot = new THREE.Mesh(new THREE.CircleGeometry(r * 0.82, 24), bm); bot.rotation.x = -Math.PI / 2; bot.position.set(x, y + 0.01, z); scene.add(bot);
    const fill = new THREE.Mesh(new THREE.CircleGeometry(r * 0.97, 24), dirt); fill.rotation.x = -Math.PI / 2; fill.position.set(x, y + 0.36, z); scene.add(fill);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(r, 0.012, 6, 40), bm); rim.rotation.x = Math.PI / 2; rim.position.set(x, y + 0.42, z); scene.add(rim);
    colliders.cyl.push({ x, z, r, top: y + 0.42 });
  }
}
// 파란 상자
{
  const x = -3.3, z = 5.2, y = H(x, z) - 0.03;
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.42, 0.48), new THREE.MeshStandardMaterial({ color: 0x5c86a8, roughness: 0.7 }));
  m.position.set(x, y + 0.21, z); m.rotation.y = 0.25; m.castShadow = m.receiveShadow = true; scene.add(m);
  colliders.cyl.push({ x, z, r: 0.36, top: y + 0.42 });
}
// 바위들
{
  const rockM = pbr('rock_face', 1, 1, { envMapIntensity: 0.2, color: 0xbdb2a2 });
  const rng = (() => { let a = 99; return () => { a = (a * 16807) % 2147483647; return a / 2147483647; }; })();

// 삼각대 작업등
const beams = [];
function lamp(x, z, aim) {

  const metal = new THREE.MeshStandardMaterial({ color: 0x9a9a96, metalness: 0.8, roughness: 0.35 });
  const legM = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.5, roughness: 0.5 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.022, 1.6, 10), metal); pole.position.set(x, y0 + 1.35, z); pole.castShadow = true; scene.add(pole);

  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.22), new THREE.MeshBasicMaterial({ color: 0xfff6e6 })); face.position.z = 0.041; head.add(face);
  const spot = new THREE.SpotLight(0xfff1dc, 260, 0, 0.62, 0.55, 2);

const hapLbl = (() => { const l = document.createElement('label'); l.style.cssText = 'position:fixed;left:-99px;top:0;width:1px;height:1px;opacity:0;pointer-events:none'; const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.appendChild(i); document.body.appendChild(l); return l; })();

// ---------- 진행 ----------
const timeEl = document.getElementById('time'), foundEl = document.getElementById('found');

function showToast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(showToast.h); showToast.h = setTimeout(() => el.classList.remove('show'), 2200); }
